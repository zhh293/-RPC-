<script>
	var draw = function(img) {
		var canvas = document.getElementById("canvas_header");
		var context = canvas.getContext("2d");
		var userPicW = $(".fixed-avatar-picture").width()*2
		// console.log(userPicW,img.height,img.width)
		context.drawImage(img,(userPicW - userPicW/img.height*img.width)/2, 0,userPicW/img.height*img.width,userPicW);
		canvas = $("#canvas_header");
		var canvasOffset = canvas.offset();
		var canvasX = Math.floor(this.pageX - canvasOffset.left);
		var canvasY = Math.floor(this.pageY - canvasOffset.top);
		var colorDataLeft = document.getElementById("canvas_header").getPixelColor(userPicW/5, userPicW/8*3);
		var colorDataRight = document.getElementById("canvas_header").getPixelColor(userPicW/5*4, userPicW/8*3);
		$(".user-head-color-left").css("backgroundColor", colorDataLeft.rgba);
		$(".user-head-color-right").css("backgroundColor", colorDataRight.rgba);
	}
</script>
